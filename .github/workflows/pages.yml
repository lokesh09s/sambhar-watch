# Publish the website (web/ folder) to GitHub Pages.
# GitHub's "Static HTML" starter workflow, with the upload path set to web/.
# One-time setup after the first push: Settings -> Pages -> Source: GitHub Actions.
name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # allows running it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let a running one finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload web/ folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
